[project]
name = "blueos-vision"
version = "0.1.0"
description = "BlueOS extension for Coral-accelerated onboard vision"
requires-python = ">=3.9,<3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "litestar[standard]",
    "Pillow",
]
[tool.setuptools]
py-modules = ["main"]