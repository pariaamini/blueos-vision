<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeltaSea Vision</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color-scheme: dark;

      --background: #111827;
      --panel: #1f2937;
      --border: #374151;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #4ade80;
      --error: #f87171;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 720px;
      margin: 60px auto;
      padding: 0 20px;
      color: var(--text);
      background: var(--background);
    }

    h1 {
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 600;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .status-box,
    .output-box {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .value {
      font-size: 15px;
      font-weight: 600;
    }

    .ready {
      color: var(--success);
    }

    .unknown {
      color: var(--muted);
    }

    .error {
      color: var(--error);
    }

    button {
      margin-bottom: 20px;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      color: #111827;
      background: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .output-box {
      min-height: 140px;
    }

    #message {
      margin: 0 0 12px;
      color: var(--muted);
    }

    #message.error {
      color: var(--error);
    }

    .detection {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .confidence {
      color: var(--accent);
    }

    #timings {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 500px) {
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<!-- i h8 css -->

<body>
  <main>
    <h1>DeltaSea Vision</h1>

    <section class="status-grid">
      <div class="status-box">
        <div class="label">Extension</div>
        <div class="value ready">Running</div>
      </div>

      <div class="status-box">
        <div class="label">Coral USB</div>
        <div id="coral-status" class="value unknown">Not Connected</div>
      </div>

      <div class="status-box">
        <div class="label">Camera</div>
        <div class="value unknown">Not connected</div>
      </div>
    </section>

    <button id="run-test" type="button">Run Test</button>

    <section class="output-box">
      <div class="label">Output</div>

      <p id="message">Waiting to begin.</p>

      <div id="results"></div>

      <div id="timings" hidden></div>
    </section>
  </main>


  <script>
    const mavlink2rest_url = `http://blueos.local/mavlink2rest`
    const attitude_url = mavlink2rest_url + '/mavlink/vehicles/1/components/1/messages/ATTITUDE'
    //const mavlink2rest_url = `http://${document.location.hostname}/mavlink2rest`  change above link to follow this format

    const button = document.getElementById("run-test");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const timings = document.getElementById("timings");
    const coralStatus = document.getElementById("coral-status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.className = "";
      message.textContent = "Running inference...";
      results.replaceChildren();
      timings.hidden = true;

      try {
        const response = await fetch("/test_coral");
        const data = await response.json();

        if (!data.success) {
          throw new Error(`${data.error_type}: ${data.error}`);
        }

        coralStatus.textContent = "Connected";
        coralStatus.className = "value ready";

        message.textContent =
          `Detected ${data.detections.length} object(s).`;

        for (const detection of data.detections) {
          const row = document.createElement("div");
          row.className = "detection";

          const label = document.createElement("span");
          label.textContent = detection.label;

          const confidence = document.createElement("span");
          confidence.className = "confidence";
          confidence.textContent =
            `${(detection.confidence * 100).toFixed(1)}%`;

          row.append(label, confidence);
          results.append(row);
        }

        timings.textContent =
          `Inference: ${data.inference_times_ms.join(", ")} ms`;

        timings.hidden = false;
      } catch (error) {
        coralStatus.textContent = "Test failed";
        coralStatus.className = "value error";

        message.className = "error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    setInterval(async () => {
      const response = await fetch(attitude_url);
      const data = await response.json();
      const payload = data["message"]
      const last_updated = data["status"]["time"]["last_update"]
      document.getElementById("roll").innerText = (payload["roll"] / Math.PI * 180).toFixed(1)
      document.getElementById("pitch").innerText = (payload["pitch"] / Math.PI * 180).toFixed(1)
      document.getElementById("yaw").innerText = (payload["yaw"] / Math.PI * 180).toFixed(1)
      document.getElementById("last").innerText = ((Date.now() - Date.parse(last_updated)) / 1000).toFixed(1)
    }, 1000)
  </script>
</body>

</html>
