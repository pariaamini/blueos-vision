<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeltaSea Vision</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color-scheme: dark;

      --background: #111827;
      --panel: #1f2937;
      --border: #374151;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #4ade80;
      --error: #f87171;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 720px;
      margin: 60px auto;
      padding: 0 20px;
      color: var(--text);
      background: var(--background);
    }

    h1 {
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 600;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .status-box,
    .output-box {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .value {
      font-size: 15px;
      font-weight: 600;
    }

    .ready {
      color: var(--success);
    }

    .unknown {
      color: var(--muted);
    }

    .error {
      color: var(--error);
    }

    button {
      margin-bottom: 20px;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      color: #111827;
      background: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .output-box {
      min-height: 140px;
    }

    #message {
      margin: 0 0 12px;
      color: var(--muted);
    }

    #message.error {
      color: var(--error);
    }

    .detection {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .confidence {
      color: var(--accent);
    }

    #timings {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 500px) {
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<!-- i h8 css -->

<body>
  <main>
    <h1>DeltaSea Vision</h1>

    <section class="status-grid">
      <div class="status-box">
        <div class="label">Extension</div>
        <div class="value ready">Running</div>
      </div>

      <div class="status-box">
        <div class="label">Coral USB</div>
        <div id="coral-status" class="value unknown">Not Connected</div>
      </div>

      <div class="status-box">
        <div class="label">Camera</div>
        <div class="value unknown">Not connected</div>
      </div>
    </section>

    <button id="run-test" type="button">Run Test</button>

    <button id="test-mavlink" type="button">Test Navigator Connection</button>
    <p id="mavlink-result">Navigator not tested.</p>

    <section class="output-box">
      <div class="label">Output</div>

      <p id="message">Waiting to begin.</p>

      <div id="results"></div>

      <div id="timings" hidden></div>
    </section>
  </main>


  <script>
    const mavlink2rest_url = `http://blueos.local/mavlink2rest`
    const attitude_url = mavlink2rest_url + '/mavlink/vehicles/1/components/1/messages/ATTITUDE'
    //const mavlink2rest_url = `http://${document.location.hostname}/mavlink2rest`  change above link to follow this format

    const button = document.getElementById("run-test");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const timings = document.getElementById("timings");
    const coralStatus = document.getElementById("coral-status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.className = "";
      message.textContent = "Running inference...";
      results.replaceChildren();
      timings.hidden = true;

      try {
        const response = await fetch("/test_coral");
        const data = await response.json();

        if (!data.success) {
          throw new Error(`${data.error_type}: ${data.error}`);
        }

        coralStatus.textContent = "Connected";
        coralStatus.className = "value ready";

        message.textContent =
          `Detected ${data.detections.length} object(s).`;

        for (const detection of data.detections) {
          const row = document.createElement("div");
          row.className = "detection";

          const label = document.createElement("span");
          label.textContent = detection.label;

          const confidence = document.createElement("span");
          confidence.className = "confidence";
          confidence.textContent =
            `${(detection.confidence * 100).toFixed(1)}%`;

          row.append(label, confidence);
          results.append(row);
        }

        timings.textContent =
          `Inference: ${data.inference_times_ms.join(", ")} ms`;

        timings.hidden = false;
      } catch (error) {
        coralStatus.textContent = "Test failed";
        coralStatus.className = "value error";

        message.className = "error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    setInterval(async () => {
      const response = await fetch(attitude_url);
      const data = await response.json();
      const payload = data["message"]
      const last_updated = data["status"]["time"]["last_update"]
      document.getElementById("roll").innerText = (payload["roll"] / Math.PI * 180).toFixed(1)
      document.getElementById("pitch").innerText = (payload["pitch"] / Math.PI * 180).toFixed(1)
      document.getElementById("yaw").innerText = (payload["yaw"] / Math.PI * 180).toFixed(1)
      document.getElementById("last").innerText = ((Date.now() - Date.parse(last_updated)) / 1000).toFixed(1)
    }, 1000)

    const mavlink2restUrl =
      `http://${document.location.hostname}/mavlink2rest`;

    const mavlinkButton =
      document.getElementById("test-mavlink");

    const mavlinkResult =
      document.getElementById("mavlink-result");

    mavlinkButton.addEventListener("click", async () => {
      mavlinkButton.disabled = true;
      mavlinkResult.textContent = "Requesting data from Navigator...";

      try {
        // Ask MAVLink2REST for a correctly structured COMMAND_LONG message.
        const templateResponse = await fetch(
          `${mavlink2restUrl}/helper/mavlink?name=COMMAND_LONG`
        );

        if (!templateResponse.ok) {
          throw new Error(
            `Could not get message template: HTTP ${templateResponse.status}`
          );
        }

        const command = await templateResponse.json();

        // Address the command to ArduRover on the Navigator.
        command.message.target_system = 1;
        command.message.target_component = 1;

        // MAV_CMD_REQUEST_MESSAGE asks the flight controller to send
        // one specific message back.
        command.message.command = {
          type: "MAV_CMD_REQUEST_MESSAGE"
        };

        // Message ID 148 is AUTOPILOT_VERSION.
        command.message.param1 = 148;
        command.message.param2 = 0;
        command.message.param3 = 0;
        command.message.param4 = 0;
        command.message.param5 = 0;
        command.message.param6 = 0;
        command.message.param7 = 0;
        command.message.confirmation = 0;

        // MAVLink2REST translates this HTTP POST into a MAVLink message.
        const sendResponse = await fetch(
          `${mavlink2restUrl}/mavlink`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(command)
          }
        );

        if (!sendResponse.ok) {
          throw new Error(
            `MAVLink send failed: HTTP ${sendResponse.status}`
          );
        }

        // Give ArduRover a moment to answer.
        await new Promise(resolve => setTimeout(resolve, 1000));

        const versionResponse = await fetch(
          `${mavlink2restUrl}/mavlink/vehicles/1/components/1/messages/AUTOPILOT_VERSION`
        );

        if (!versionResponse.ok) {
          throw new Error(
            `No AUTOPILOT_VERSION response: HTTP ${versionResponse.status}`
          );
        }

        const versionData = await versionResponse.json();

        mavlinkResult.textContent =
          `Navigator replied: ${JSON.stringify(versionData.message)}`;

      } catch (error) {
        mavlinkResult.textContent = `Test failed: ${error.message}`;
        console.error(error);

      } finally {
        mavlinkButton.disabled = false;
      }
    });

    const attitudeUrl =
      mavlink2restUrl +
      "/mavlink/vehicles/1/components/1/messages/ATTITUDE";

    async function updateAttitude() {
      try {
        const response = await fetch(attitudeUrl);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const attitude = data.message;
        const lastUpdated = data.status.time.last_update;

        document.getElementById("roll").textContent =
          (attitude.roll * 180 / Math.PI).toFixed(1);

        document.getElementById("pitch").textContent =
          (attitude.pitch * 180 / Math.PI).toFixed(1);

        document.getElementById("yaw").textContent =
          (attitude.yaw * 180 / Math.PI).toFixed(1);

        document.getElementById("last").textContent =
          ((Date.now() - Date.parse(lastUpdated)) / 1000).toFixed(1);

      } catch (error) {
        console.error("Could not read ATTITUDE:", error);
      }
    }

    updateAttitude();
    setInterval(updateAttitude, 1000);
  </script>

  <h3>Rover attitude</h3>

  <p>
    Roll: <span id="roll">--.-</span>°
    Pitch: <span id="pitch">--.-</span>°
    Yaw: <span id="yaw">--.-</span>°
  </p>

  <p>
    Last updated:
    <span id="last">--.-</span> seconds ago
  </p>
</body>

</html>
